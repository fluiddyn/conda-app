stages:
  - test
  - build
  - release

image: python:3.12

test-run:
  stage: test
  script:
    - wget "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
    - bash Miniforge3-$(uname)-$(uname -m).sh -b
    - ls ~/miniforge3
    - ~/miniforge3/bin/conda init bash
    - . ~/.bashrc
    - conda --version
    - pip install .
    - conda-app install mercurial
    - conda-app install pdm python=3.11
    - conda env list
    - . ~/.bashrc
    - hg debuginstall
    - mkdir -p $HOME/tmp
    - cd $HOME/tmp
    - hg clone https://github.com/fluiddyn/conda-app.git
    - cd conda-app
    - ls
    - conda-app list

build-package:
  stage: build
  before_script:
    - python -m pip install build twine
  script:
    - python -m build
    - twine check dist/*
  needs: []
  artifacts:
    when: always
    paths:
      - dist
    expire_in: 24 hrs

# manually set TWINE_PASSWORD in web interface to your PyPI API token
release-package:
  stage: release
  needs: ["build-package", "test-run"]
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: on_success
  variables:
    TWINE_USERNAME: __token__
  before_script:
    - pip install twine -U
  script:
    - ls dist/*
    - twine upload dist/*
